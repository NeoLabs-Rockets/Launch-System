name: Firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      firmware_version: ${{ steps.version.outputs.firmware_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Derive firmware version
        id: version
        shell: bash
        run: |
          base_version="$(tr -d '[:space:]' < firmware-version.txt)"
          if [[ ! "$base_version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,49}$ ]]; then
            echo "Invalid firmware-version.txt" >&2
            exit 1
          fi
          echo "FIRMWARE_VERSION=${base_version}+${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          echo "firmware_version=${base_version}+${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        shell: bash
        run: PLATFORMIO_BUILD_FLAGS="-D FIRMWARE_VERSION=\\\"${FIRMWARE_VERSION}\\\"" pio run -e esp32dev

      - name: Create and verify release assets
        shell: bash
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware.bin
          python scripts/create_firmware_manifest.py \
            --firmware dist/firmware.bin \
            --output dist/manifest.json \
            --version "$FIRMWARE_VERSION" \
            --commit "$GITHUB_SHA" \
            --environment esp32dev
          python -m json.tool dist/manifest.json >/dev/null

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            dist/firmware.bin
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30


  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download verified firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist

      - name: Publish rolling main release
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_VERSION: ${{ needs.build.outputs.firmware_version }}
        shell: bash
        run: |
          git tag --force firmware-latest "$GITHUB_SHA"
          git push --force origin refs/tags/firmware-latest
          if ! gh release view firmware-latest >/dev/null 2>&1; then
            gh release create firmware-latest --title "Latest firmware" --notes "Rolling firmware build from main."
          fi
          gh release upload firmware-latest dist/firmware.bin --clobber
          gh release upload firmware-latest dist/manifest.json --clobber
          gh release edit firmware-latest --title "Latest firmware · ${FIRMWARE_VERSION}" --notes "Automated build from commit ${GITHUB_SHA}."
